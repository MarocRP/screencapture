name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Build and Create Tagged release
    runs-on: ubuntu-latest

    steps:
      - name: Install archive tools
        run: sudo apt install zip

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.11.0

      - name: Get variables
        id: get_vars
        run: |
          echo '::set-output name=SHORT_SHA::$(git rev-parse --short HEAD)'
          echo '::set-output name=DATE::$(date +'%D')'

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Set Sentry release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export SENTRY_RELEASE="screencapture@$VERSION"
          node -e "const fs = require('fs'); const file = 'game/sentry-config.ts'; const release = process.env.SENTRY_RELEASE; const content = fs.readFileSync(file, 'utf8'); const next = content.replace(/^export const SENTRY_RELEASE = .*;$/m, \"export const SENTRY_RELEASE = '\" + release + \"';\"); if (next === content) throw new Error('Could not update SENTRY_RELEASE in game/sentry-config.ts'); fs.writeFileSync(file, next);"
          echo "SENTRY_RELEASE=$SENTRY_RELEASE" >> "$GITHUB_ENV"

      - name: Run build
        run: pnpm build
        env:
          CI: false
          SENTRY_SOURCEMAPS: true

      - name: Upload Sentry source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_SERVER_PROJECT: ${{ secrets.SENTRY_SERVER_PROJECT }}
          SENTRY_NUI_PROJECT: ${{ secrets.SENTRY_NUI_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_SERVER_PROJECT" ] || [ -z "$SENTRY_NUI_PROJECT" ]; then
            echo "Skipping Sentry source map upload; SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_SERVER_PROJECT, or SENTRY_NUI_PROJECT is not configured."
            exit 0
          fi

          pnpm exec sentry-cli releases new "$SENTRY_RELEASE" || true
          pnpm exec sentry-cli sourcemaps inject ./game/dist ./game/nui/dist
          SENTRY_PROJECT="$SENTRY_SERVER_PROJECT" pnpm exec sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" ./game/dist/server.js ./game/dist/server.js.map
          SENTRY_PROJECT="$SENTRY_NUI_PROJECT" pnpm exec sentry-cli sourcemaps upload --release "$SENTRY_RELEASE" ./game/nui/dist
          pnpm exec sentry-cli releases finalize "$SENTRY_RELEASE"

      - name: Bump manifest version
        run: node .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Push manifest change
        uses: EndBug/add-and-commit@v8
        with:
          add: fxmanifest.lua
          push: true
          author_name: Manifest Bumper
          message: 'chore: bump manifest version to ${{ github.ref_name }}'

      - name: Update tag ref
        uses: EndBug/latest-tag@latest
        with:
          ref: ${{ github.ref_name }}

      - name: Bundle files
        run: |
          mkdir -p ./temp/screencapture
          mkdir -p ./temp/screencapture/game
          mkdir -p ./temp/screencapture/game/nui
          cp ./{README.md,LICENSE,fxmanifest.lua} ./temp/screencapture
          cp -r ./game/dist ./temp/screencapture/game/dist
          cp -r ./game/nui/dist ./temp/screencapture/game/nui/dist
          find ./temp/screencapture -name "*.map" -delete
          cd ./temp && zip -r ../screencapture.zip ./screencapture

      - name: Create Release
        uses: 'marvinpinto/action-automatic-releases@v1.2.1'
        id: auto_release
        with:
          repo_token: '${{ secrets.GITHUB_TOKEN }}'
          title: '${{ env.RELEASE_VERSION }}'
          prerelease: false
          files: screencapture.zip

        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
